[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["flownexus", "core", "sensordata", "frontend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
