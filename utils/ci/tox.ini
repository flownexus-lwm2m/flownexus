[tox]
envlist = compliance
skipsdist = True

[testenv:compliance]
# We need to set BASE_REF default to main if not provided by CI
setenv =
    BASE_REF = {env:BASE_REF:main}
deps =
    -r{toxinidir}/requirements.txt
allowlist_externals =
    git
commands =
    # Run pre-commit hooks (ruff, whitespace, large files) on all files
    pre-commit run --all-files --show-diff-on-failure
    # Run gitlint on the commit range
    gitlint --commits "origin/{env:BASE_REF}..HEAD"
