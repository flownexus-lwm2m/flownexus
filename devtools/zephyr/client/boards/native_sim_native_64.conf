# Use host sockets (NSOS), so no TAP interface or root privileges are needed.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=8
# Log directly to stdout; the shell backend drops boot messages
# and would print every line twice next to the native backend.
CONFIG_SHELL_LOG_BACKEND=n
