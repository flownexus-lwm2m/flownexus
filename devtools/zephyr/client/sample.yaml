sample:
  name: Flownexus LwM2M client
common:
  tags:
    - lwm2m
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
tests:
  flownexus.client.shell:
    harness: shell
    extra_configs:
      - CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
  flownexus.client.dtls:
    build_only: true
    extra_args: EXTRA_CONF_FILE=overlay-dtls.conf
  flownexus.client.bootstrap:
    build_only: true
    extra_args: EXTRA_CONF_FILE=overlay-bootstrap.conf
  flownexus.client.queue:
    build_only: true
    extra_args: EXTRA_CONF_FILE=overlay-queue.conf
