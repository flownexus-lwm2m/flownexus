
INTERFACE="zeth.0"
ip link set dev zeth.0 up
ip link set dev zeth.0 address 00:00:5e:00:00:00

ip address add 192.0.0.1/24 dev zeth.0
ip route add 192.0.0.0/24 dev zeth.0 > /dev/null 2>&1

iptables -t nat -A POSTROUTING -j MASQUERADE -s 192.0.0.0/24

sysctl -w net.ipv4.ip_forward=1
iptables -P FORWARD ACCEPT
