# Flownexus nginx Configuration
# Install to /etc/nginx/sites-enabled/flownexus.conf on the server.
#
# Serves:
#   flownexus.org            — Landing page (static HTML)
#   docs.flownexus.org       — Documentation (Sphinx HTML)
#   fw.flownexus.org         — Firmware binaries (IoT-safe TLS, no HTTP/2)
#   dashboard.flownexus.org  — Django dashboard (reverse proxy to uvicorn)
#
# TLS certificates are managed by certbot (Let's Encrypt).
# All four domains share one SAN certificate issued as:
#   sudo certbot certonly --nginx --cert-name flownexus.org \
#       -d flownexus.org -d docs.flownexus.org \
#       -d fw.flownexus.org -d dashboard.flownexus.org
# The deploy script substitutes __TLS_CERT_DIR__ with the configured lineage
# directory (default: /etc/letsencrypt/live/flownexus.org).
#
# IMPORTANT: nginx handles HTTP/HTTPS traffic only.
# UDP traffic for LwM2M (CoAP) is handled separately in server/compose.yml.

# --------------------------------------------------------------------------
# flownexus.org — Landing page
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flownexus.org;

    ssl_certificate     __TLS_CERT_DIR__/fullchain.pem;
    ssl_certificate_key __TLS_CERT_DIR__/privkey.pem;

    root /var/www/flownexus/landing;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    server_tokens off;

    # Block hidden/dot files
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    access_log /var/log/nginx/flownexus.org-access.log;
    error_log  /var/log/nginx/flownexus.org-error.log;
}

# --------------------------------------------------------------------------
# docs.flownexus.org — Sphinx documentation
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.flownexus.org;

    ssl_certificate     __TLS_CERT_DIR__/fullchain.pem;
    ssl_certificate_key __TLS_CERT_DIR__/privkey.pem;

    root /var/www/flownexus/docs;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Block hidden/dot files
    location ~ /\. {
        return 404;
    }

    # Sphinx HTML fallback: try exact path, then .html, then directory index
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    access_log /var/log/nginx/docs.flownexus.org-access.log;
    error_log  /var/log/nginx/docs.flownexus.org-error.log;
}

# --------------------------------------------------------------------------
# fw.flownexus.org — Firmware download server (IoT-safe TLS)
# --------------------------------------------------------------------------
#
# This server block is specifically configured for constrained IoT devices
# such as the Nordic nRF9160 whose modem TLS engine has a limited receive
# buffer (max 2048 bytes for TLS records).
#
# Key settings:
#   ssl_buffer_size 1370  — Keeps TLS records within a single TCP segment
#                           (1500 MTU - 20 IP - 20 TCP - TLS overhead).
#                           The nRF9160 modem rejects records larger than
#                           its internal buffer with NRF_EMSGSIZE (errno 122).
#   No HTTP/2             — HTTP/2 framing adds overhead that can push TLS
#                           records above the device buffer limit.
#   No gzip               — Firmware binaries are not compressible; gzip
#                           would only add overhead and complexity.
#
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fw.flownexus.org;

    ssl_certificate     __TLS_CERT_DIR__/fullchain.pem;
    ssl_certificate_key __TLS_CERT_DIR__/privkey.pem;
    ssl_buffer_size 1370;

    root /var/www/flownexus;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Download-Options "noopen" always;
    server_tokens off;

    # Block hidden/dot files
    location ~ /\. {
        return 404;
    }

    # Serve only concrete files — no directory listings, no index pages
    location / {
        try_files $uri =404;
    }

    access_log /var/log/nginx/fw.flownexus.org-access.log;
    error_log  /var/log/nginx/fw.flownexus.org-error.log;
}

# --------------------------------------------------------------------------
# dashboard.flownexus.org — Django application (reverse proxy)
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.flownexus.org;

    ssl_certificate     __TLS_CERT_DIR__/fullchain.pem;
    ssl_certificate_key __TLS_CERT_DIR__/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://rsms.me; img-src 'self' data: blob: https:; font-src 'self' https://rsms.me; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    server_tokens off;

    # Block hidden/dot files
    location ~ /\. {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    access_log /var/log/nginx/dashboard.flownexus.org-access.log;
    error_log  /var/log/nginx/dashboard.flownexus.org-error.log;
}

# --------------------------------------------------------------------------
# HTTP → HTTPS redirects (certbot typically adds these automatically)
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name flownexus.org docs.flownexus.org fw.flownexus.org dashboard.flownexus.org;
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------------
# localhost — Health check / internal access (plain HTTP, no TLS)
# --------------------------------------------------------------------------
server {
    listen 127.0.0.1:80;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}

# --------------------------------------------------------------------------
# WebSocket upgrade map (required for proxy_set_header Connection)
# --------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
