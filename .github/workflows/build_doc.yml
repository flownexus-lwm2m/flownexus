name: Build Sphinx Doc

on:
  pull_request:

jobs:
  build-doc:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install Packages
      run: |
        sudo apt-get update
        sudo apt-get install default-jre plantuml graphviz jq tox texlive-latex-extra texlive-xetex latexmk python3-pip imagemagick librsvg2-bin -y

    - name: Build static site
      run: |
        make doc-html
        make doc-pdf
