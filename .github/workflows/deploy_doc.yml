name: Build and Deploy Sphinx Doc

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install default-jre plantuml graphviz jq tox texlive-latex-extra texlive-xetex latexmk python3-pip imagemagick librsvg2-bin -y

      - name: Build static site
        run: |
          make doc-html
          make doc-pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: doc/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
