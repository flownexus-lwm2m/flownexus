name: Deploy (tech22.de)

# NOTE: The server's /home/flownexus/flownexus repo must be cloned from
# git@github.com:jonas-rem/flownexus_tech22.git so that git fetch origin
# resolves the commit SHA pushed to this repository.

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  DEPLOY_USER: flownexus
  SERVER_HOST: tech22.de

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ==========================================
      # 2. DEPLOY TO TECH22.DE
      # ==========================================

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_TECH22 }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      # 2.1 Update backend code first (so deploy script exists)
      - name: Update backend code
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.SERVER_HOST }} \
            "cd /home/flownexus/flownexus && \
             git fetch origin && \
             git checkout ${{ github.sha }} && \
             git submodule update --init --recursive"

      # 2.2 Ensure directories exist with proper permissions
      - name: Setup deployment directories
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.SERVER_HOST }} \
            "sudo -n /home/flownexus/flownexus/deploy/deploy-flownexus --setup-only"

      # 2.3 Deploy containers
      - name: Deploy dashboard stack
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.SERVER_HOST }} \
            "sudo -n /home/flownexus/flownexus/deploy/deploy-flownexus"

      - name: Verify deployment
        run: |
          echo "Checking service health..."
          sleep 10
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.SERVER_HOST }} \
            "export XDG_RUNTIME_DIR=/run/user/\$(id -u) && \
             systemctl --user is-active flownexus-redis.service && \
             systemctl --user is-active flownexus-leshan.service && \
             systemctl --user is-active flownexus-django.service"

      # ==========================================
      # 3. CLEANUP
      # ==========================================
      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/config
