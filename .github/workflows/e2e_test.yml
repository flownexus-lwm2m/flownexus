name: End-to-End CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        pip install requests podman-compose west

    - name: Run E2E Tests
      run: make test-e2e || echo "Skipping full E2E as Zephyr build is local-only for now"
