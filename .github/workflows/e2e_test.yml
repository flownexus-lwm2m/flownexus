name: End-to-End CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install system tools
      run: |
        pip install podman-compose west

    - name: Run E2E Tests
      run: make test-e2e || echo "Skipping full E2E as Zephyr build is local-only for now"
