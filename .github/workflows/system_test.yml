name: System Tests

# Tests that need the native_sim binary or the container images: the
# gateway contract and the full-stack E2E scenarios. On push, the tested
# images are published and deploy.yml deploys them.

on:
  push:
    branches: main
    tags: ['v*']
  pull_request:
    branches: main

permissions:
  contents: read

# A newer push cancels the older run, so Deploy never follows an older commit.
concurrency:
  group: system-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sim:
    name: Zephyr client (checkpatch, build, twister)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.3
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        path: flownexus
        persist-credentials: false

    - name: Initialize west
      working-directory: flownexus
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}/flownexus"
        west init -l .
        west update --narrow -o=--depth=1
        west zephyr-export

    - name: Install Zephyr Python dependencies
      run: |
        pip install -r zephyr/scripts/requirements-base.txt \
          -r zephyr/scripts/requirements-build-test.txt \
          -r zephyr/scripts/requirements-run-test.txt

    - name: Run checkpatch
      working-directory: flownexus
      run: make checkpatch

    - name: Build native_sim
      working-directory: flownexus
      run: |
        west build -b native_sim/native/64 \
          devtools/zephyr/client \
          -d devtools/zephyr/client/build

    - name: Run twister shell test and overlay builds
      working-directory: flownexus
      run: |
        west twister -T devtools/zephyr/client -p native_sim/native/64 \
          -O twister-out --inline-logs

    - name: Upload native_sim binary
      uses: actions/upload-artifact@v4
      with:
        name: zephyr-native-sim
        path: flownexus/devtools/zephyr/client/build/zephyr/zephyr.exe
        if-no-files-found: error

  gateway-contract:
    name: Gateway contract (golden files)
    needs: build-sim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Leshan image
      uses: docker/build-push-action@v6
      with:
        context: server/leshan
        file: server/leshan/Containerfile
        build-args: REVISION=${{ github.sha }}
        tags: localhost/flownexus-leshan:latest
        load: true
        cache-from: type=gha,scope=leshan

    - name: Download native_sim binary
      uses: actions/download-artifact@v4
      with:
        name: zephyr-native-sim
        path: ${{ github.workspace }}/zephyr-bin

    - name: Check gateway against golden files
      env:
        FLOWNEXUS_RUN_E2E: "1"
        FLOWNEXUS_ZEPHYR_BINARY: ${{ github.workspace }}/zephyr-bin/zephyr.exe
        FLOWNEXUS_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/contract-artifacts
        PYTHONPATH: .:server/django
      run: |
        chmod +x "${FLOWNEXUS_ZEPHYR_BINARY}"
        make test-contract

    - name: Upload contract artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: contract-artifacts
        path: ${{ github.workspace }}/contract-artifacts
        if-no-files-found: ignore

  e2e:
    name: E2E (images, smoke test, scenarios)
    needs: [build-sim, gateway-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Necessary for git describe to work
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # GHCR rejects upper case, and forks publish under their own owner
    - name: Image names and tags
      id: image
      run: |
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        echo "prefix=ghcr.io/${owner}/flownexus" >> "$GITHUB_OUTPUT"
        echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "describe=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Leshan image
      uses: docker/build-push-action@v6
      with:
        context: server/leshan
        file: server/leshan/Containerfile
        build-args: REVISION=${{ github.sha }}
        tags: |
          localhost/flownexus-leshan:latest
          ${{ steps.image.outputs.prefix }}-leshan:${{ steps.image.outputs.sha }}
          ${{ steps.image.outputs.prefix }}-leshan:${{ steps.image.outputs.describe }}
        load: true
        cache-from: type=gha,scope=leshan
        cache-to: type=gha,mode=max,scope=leshan

    - name: Build Django image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: server/django/Dockerfile.django
        build-args: |
          APP_VERSION=${{ steps.image.outputs.describe }}
          REVISION=${{ github.sha }}
        tags: |
          localhost/flownexus-django:latest
          ${{ steps.image.outputs.prefix }}-django:${{ steps.image.outputs.sha }}
          ${{ steps.image.outputs.prefix }}-django:${{ steps.image.outputs.describe }}
        load: true
        cache-from: type=gha,scope=django
        cache-to: type=gha,mode=max,scope=django

    - name: Build Redis image
      uses: docker/build-push-action@v6
      with:
        context: server/redis
        file: server/redis/Dockerfile.redis
        build-args: REVISION=${{ github.sha }}
        tags: |
          localhost/flownexus-redis:latest
          ${{ steps.image.outputs.prefix }}-redis:${{ steps.image.outputs.sha }}
          ${{ steps.image.outputs.prefix }}-redis:${{ steps.image.outputs.describe }}
        load: true
        cache-from: type=gha,scope=redis
        cache-to: type=gha,mode=max,scope=redis

    - name: Smoke test images
      env:
        CONTAINER_RUNTIME: docker
      run: make image-smoke-test

    - name: Download native_sim binary
      uses: actions/download-artifact@v4
      with:
        name: zephyr-native-sim
        path: ${{ github.workspace }}/zephyr-bin

    - name: Run full-stack E2E
      env:
        FLOWNEXUS_RUN_E2E: "1"
        FLOWNEXUS_ZEPHYR_BINARY: ${{ github.workspace }}/zephyr-bin/zephyr.exe
        FLOWNEXUS_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/e2e-artifacts
        FLOWNEXUS_LESHAN_IMAGE: localhost/flownexus-leshan:latest
        PYTHONPATH: .:server/django
      run: |
        chmod +x "${FLOWNEXUS_ZEPHYR_BINARY}"
        make test-e2e

    - name: Log in to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push images
      if: github.event_name == 'push'
      env:
        IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
      run: |
        for service in leshan django redis; do
          docker push --all-tags "${IMAGE_PREFIX}-${service}"
        done

    - name: Upload E2E artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts
        path: ${{ github.workspace }}/e2e-artifacts
        if-no-files-found: ignore
