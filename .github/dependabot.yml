version: 2
updates:
  - package-ecosystem: maven
    directory: /server/leshan
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /server/leshan
      - /server/django
      - /server/redis
    schedule:
      interval: weekly
    # Stay on the JDK LTS line (25); 26-28 are non-LTS.
    ignore:
      - dependency-name: library/eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: library/maven
        versions:
          - 3.9-eclipse-temurin-26
          - 3.9-eclipse-temurin-27
          - 3.9-eclipse-temurin-28
      # Stay on Python 3.14 until gevent and its dependencies in uv.lock
      # ship 3.15 wheels; the slim image cannot compile them.
      - dependency-name: library/python
        update-types: [version-update:semver-minor]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    # sphinxcontrib-redoc imports pkg_resources, which setuptools 82 removed.
    ignore:
      - dependency-name: setuptools

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
